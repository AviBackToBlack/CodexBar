scrape_configs:
  - job_name: codexbar
    scrape_interval: 2m
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/codexbar.token
    static_configs:
      - targets:
          - 192.0.2.11:8081
          - 192.0.2.12:8081
          - 192.0.2.13:8081
