name: Validate custom LiteLLM (macOS)

on:
  push:
    branches:
      - personal/litellm-v0.83.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer" >> "$GITHUB_ENV"
          [[ "$(/usr/bin/xcodebuild -version)" == Xcode\ 27* ]]
          xcodebuild -version
      - name: Ensure bundled JavaScript syntax
        run: node --check Sources/CodexBarCore/Resources/Plugins/litellm.js
      - name: Run all LiteLLM Swift tests
        run: swift test --filter LiteLLM
