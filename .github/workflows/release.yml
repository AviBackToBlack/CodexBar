name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  trigger-circleci:
    name: Trigger CircleCI release pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Trigger CircleCI pipeline
        env:
          CIRCLECI_API_TOKEN: ${{ secrets.CIRCLECI_API_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Triggering CircleCI pipeline for tag $TAG..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://circleci.com/api/v2/project/gh/nesszer/Win-CodexBar/pipeline" \
            -H "Circle-Token: $CIRCLECI_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag\":\"$TAG\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" != "201" ]; then
            echo "Failed to trigger CircleCI pipeline"
            exit 1
          fi
          PIPELINE_ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "CircleCI pipeline triggered: https://app.circleci.com/pipelines/gh/nesszer/Win-CodexBar/$PIPELINE_ID"
          echo "::notice::CircleCI pipeline triggered for $TAG"
