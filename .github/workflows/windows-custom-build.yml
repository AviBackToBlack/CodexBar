name: Windows Custom EXE

on:
  workflow_dispatch:
  push:
    branches:
      - fix/win-devin-provider
    paths:
      - '.github/workflows/windows-custom-build.yml'
      - 'apps/desktop-tauri/**'
      - 'rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  build:
    name: Build custom Windows EXE
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Activate pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          node --version
          pnpm --version

      - name: Setup Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile default
          rustup default stable-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc --toolchain stable-x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Install desktop dependencies
        shell: pwsh
        run: |
          pnpm --dir apps\desktop-tauri install --frozen-lockfile

      - name: Repair cost JSX from rebase
        shell: pwsh
        run: |
          $path = 'apps\desktop-tauri\src\components\MenuCardDetails.tsx'
          $lines = [System.Collections.Generic.List[string]]::new()
          Get-Content -LiteralPath $path | ForEach-Object { [void]$lines.Add($_) }

          $start = -1
          $end = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($start -lt 0 -and $lines[$i].Contains('{balanceOnlyCost ? (')) { $start = $i }
            if ($start -ge 0 -and $lines[$i].Contains('{provider.providerId === "mistral"')) { $end = $i; break }
          }
          if ($start -lt 0 -or $end -lt 0) { throw 'Could not locate cost JSX block.' }

          $branches = @()
          for ($i = $start; $i -lt $end; $i++) {
            if ($lines[$i].Trim() -eq ') : (') { $branches += $i }
          }
          if ($branches.Count -ne 3) {
            throw "Expected exactly 3 duplicated ternary branch markers, found $($branches.Count)."
          }

          $lines[$branches[0]] = '          ) : spendAndBalanceCost ? ('
          $removeStart = $branches[1]
          $removeCount = $branches[2] - $branches[1]
          $lines.RemoveRange($removeStart, $removeCount)

          $balanceArgFixed = $false
          for ($i = $start; $i -lt [Math]::Min($start + 20, $lines.Count); $i++) {
            if ($lines[$i].Trim() -eq 'provider.cost.balance,') {
              $lines[$i] = '                  costBalance!,'
              $balanceArgFixed = $true
              break
            }
          }
          if (-not $balanceArgFixed) { throw 'Could not locate narrowed balance argument.' }

          Set-Content -LiteralPath $path -Value $lines -Encoding utf8
          Write-Host 'Repaired cost JSX block:'
          Get-Content -LiteralPath $path | Select-Object -Skip ($start - 2) -First 90

      - name: Build Tauri desktop
        shell: pwsh
        run: |
          pnpm --dir apps\desktop-tauri exec tauri build --ci --no-bundle --target x86_64-pc-windows-msvc

      - name: Prepare artifact
        shell: pwsh
        run: |
          $source = Join-Path $env:CARGO_TARGET_DIR 'x86_64-pc-windows-msvc\release\codexbar-desktop-tauri.exe'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            Write-Host 'Expected EXE not found. Candidate executables:'
            Get-ChildItem -Path $env:CARGO_TARGET_DIR -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object FullName, Length
            throw "Missing expected Tauri executable: $source"
          }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -LiteralPath $source -Destination artifact\codexbar.exe -Force
          Get-FileHash artifact\codexbar.exe -Algorithm SHA256 | Format-List
          Get-Item artifact\codexbar.exe | Select-Object FullName, Length, LastWriteTime

      - name: Upload codexbar.exe
        uses: actions/upload-artifact@v4
        with:
          name: codexbar-windows-custom-${{ github.sha }}
          path: artifact/codexbar.exe
          if-no-files-found: error
          retention-days: 14
