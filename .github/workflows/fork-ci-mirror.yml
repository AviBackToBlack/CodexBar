name: Fork PR CI mirror

# CircleCI GitHub App pipelines never fire for pull requests from forks, so
# fork PRs used to merge with no hosted Windows check. A maintainer approves a
# fork PR's current head by adding the `ci:run` label. This workflow then
# copies exactly that commit to ci/pr-<number> in this repository. CircleCI
# builds the push (scripts/circleci-pr-common.ps1 lets ci/pr-<number> through),
# and its check lands on the same commit, so it shows on the fork PR.
#
# Safety:
# - pull_request_target runs this file from the base branch, never the fork's
#   copy. No step checks out, installs, or executes fork code here; the job
#   only moves a git ref. The fork code runs later on CircleCI, which is the
#   reason for the label gate.
# - Only users with triage access or higher can add labels.
# - Any new push to the fork PR removes the label, so every new head needs a
#   fresh maintainer approval before CircleCI builds it.
# - The mirror branch is removed when the PR closes.
# - GITHUB_TOKEN cannot push commits that change .github/workflows/**; such
#   fork PRs fail the mirror step and need a manual review path.
on:
  pull_request_target:
    types: [labeled, synchronize, closed]

permissions: {}

concurrency:
  group: fork-ci-mirror-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror approved fork head
    if: >-
      github.event.action == 'labeled' &&
      github.event.label.name == 'ci:run' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      github.event.pull_request.state == 'open' &&
      vars.CI_BUDGET_MODE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Push the approved commit to ci/pr-<number>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init --quiet mirror
          cd mirror
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git remote add origin "https://github.com/${REPO}.git"
          # Fetch the approved commit by SHA, not the moving pull ref, so a
          # push that races the label can never be mirrored unapproved.
          git -c http.extraheader="$auth" fetch --quiet --no-tags --depth=1 origin "$HEAD_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          # The mirror branch belongs to this workflow; a re-approval replaces it.
          git -c http.extraheader="$auth" push --quiet --force origin "${HEAD_SHA}:refs/heads/ci/pr-${PR_NUMBER}"
          echo "Mirrored ${HEAD_SHA} to ci/pr-${PR_NUMBER}; CircleCI pr-check will report on this commit." >> "$GITHUB_STEP_SUMMARY"

  revoke:
    name: Require re-approval after a new push
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      contains(github.event.pull_request.labels.*.name, 'ci:run')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove the ci:run label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method DELETE "repos/${REPO}/issues/${PR_NUMBER}/labels/ci:run" --silent
          echo "New commits on a fork PR: ci:run removed. Re-add it after reviewing the new head." >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Remove the mirror branch
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete ci/pr-<number> if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/${REPO}/git/ref/heads/ci/pr-${PR_NUMBER}" --silent 2>/dev/null; then
            gh api --method DELETE "repos/${REPO}/git/refs/heads/ci/pr-${PR_NUMBER}" --silent
            echo "Removed ci/pr-${PR_NUMBER}." >> "$GITHUB_STEP_SUMMARY"
          fi
